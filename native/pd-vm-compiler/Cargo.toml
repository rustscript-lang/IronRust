[package]
name = "pd-vm-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ABI declarations only: none of these features includes a protocol implementation.
edge = { package = "pd-edge-abi", git = "https://github.com/rustscript-lang/pd-edge.git", rev = "9a9ee3303a17fcf65893f04b1ce4e4df9d7f50c1", default-features = false, features = ["console", "http", "tls", "websocket"] }
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript.git", rev = "2f433edab3f1907e8cb060e901357d7e2af016ce", default-features = false }

[dev-dependencies]
# Execute parity fixtures with the runtime in tests only.
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript.git", rev = "2f433edab3f1907e8cb060e901357d7e2af016ce", default-features = false, features = ["runtime"] }
