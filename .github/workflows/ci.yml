name: IronRust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native compiler fmt
        run: cargo fmt --all --check --manifest-path native/pd-vm-compiler/Cargo.toml
      - name: Native compiler clippy
        run: cargo clippy --locked --all-targets --all-features --manifest-path native/pd-vm-compiler/Cargo.toml -- -D warnings
      - name: Build native compiler
        run: cargo build --locked --release --all-targets --all-features --manifest-path native/pd-vm-compiler/Cargo.toml
      - name: Test native compiler
        run: cargo test --locked --release --all-targets --all-features --manifest-path native/pd-vm-compiler/Cargo.toml -- --test-threads=1
      - name: Select native compiler library
        shell: pwsh
        run: |
          $nativeName = if ($IsWindows) { 'pd_vm_compiler.dll' } else { 'libpd_vm_compiler.so' }
          "PDVM_NATIVE_COMPILER=$env:GITHUB_WORKSPACE/native/pd-vm-compiler/target/release/$nativeName" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore IronRust.sln
      - name: Build
        run: dotnet build IronRust.sln --no-restore --configuration Release
      - name: Tests
        run: dotnet test IronRust.sln --no-build --configuration Release --verbosity normal
